<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Manager</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Everything is rendered by main.js. Views build their DOM with
         textContent, never innerHTML, because nearly every string shown is
         user data. -->
    <div id="app"></div>
    <!-- Print output lives outside #app so printing a report or a recovery
         sheet never has to fight the layout of the screen it came from. -->
    <div id="print-root" aria-hidden="true"></div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>

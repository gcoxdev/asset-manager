name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        # Tauri needs WebKitGTK on Linux; the vault's own crypto is vendored.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      # The toolchain rust-toolchain.toml pins, so CI tests what developers
      # build with rather than whatever stable is today.
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: Swatinem/rust-cache@v2

      - name: Build frontend
        # tauri::generate_context! reads frontendDist at compile time, so the
        # Rust build fails without it.
        run: |
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop run build

      - name: Frontend tests
        run: npm --prefix apps/desktop test

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The frontend ships inside the app, so its runtime dependencies are
      # audited too, not only the Rust ones.
      - name: npm audit
        run: npm --prefix apps/desktop audit --omit=dev --audit-level=high

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        # Tauri needs WebKitGTK on Linux; SQLCipher and its OpenSSL are bundled.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      # The toolchain rust-toolchain.toml pins, so CI tests what developers
      # build with rather than whatever stable is today.
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: Swatinem/rust-cache@v2

      - name: Build frontend
        # tauri::generate_context! reads frontendDist at compile time, so the
        # Rust build fails without it.
        run: |
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop run build

      - name: Frontend tests
        run: npm --prefix apps/desktop test

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Browser tests
        # The built frontend under the production CSP, driven against
        # responses recorded from the real commands (tests/ui_fixtures.rs).
        working-directory: apps/desktop
        run: |
          npx playwright install --with-deps chromium
          npm run test:fixtures
          npx playwright test -c tests-ui/playwright.config.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-traces
          path: apps/desktop/test-results/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pinned toolchain, and cargo-audit built from its own lockfile:
      # installed unlocked, it pulls dependencies that need a newer Rust than
      # the pinned one, and the job fails before auditing anything.
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - name: Rust advisories
        # Fails on a vulnerability; unmaintained or unsound crates are
        # reported as warnings.
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The frontend ships inside the app, so its runtime dependencies are
      # audited too, not only the Rust ones.
      - name: npm audit
        run: npm --prefix apps/desktop audit --omit=dev --audit-level=high

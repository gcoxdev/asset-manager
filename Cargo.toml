[workspace]
members = ["crates/am-core", "crates/am-crypto", "crates/am-storage", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.6"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2"
hkdf = "0.13"
# default-features off: we want no image formats we do not explicitly allow,
# and none of the codec surface we are not serving.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = { version = "3", default-features = false, features = ["linux-native", "apple-native", "windows-native"] }
rand = "0.8.6"
# zxing port. default-features off drops the image-writing/encoding side —
# this only ever decodes.
rxing = { version = "0.9", default-features = false, features = [
    "image",
    # Decode only; the encoding side is never used here.
    "decoders",
    # Encoders are used only to generate barcodes in tests.
    "encoders",
    # 1D symbologies: what slab labels actually use.
    "oned",
    # Cert and card barcodes are ASCII digits, so the character-set tables are
    # dead weight here.
    "no_character_set_support",
] }
# rustls rather than native-tls: keeps the AppImage self-contained, matching
# the vendored-OpenSSL decision for SQLCipher.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# 28-29 significant digits, exact decimal arithmetic. NOT arbitrary
# precision: overflow is a real case and must be handled, not assumed away.
rust_decimal = { version = "1", default-features = false, features = ["serde", "std"] }
# bundled-sqlcipher-vendored-openssl, NOT bundled-sqlcipher: the latter still
# links a *system* libcrypto, which would make the AppImage depend on whatever
# OpenSSL the host happens to have. Vendoring is what makes the bundle
# self-contained across distros.
rusqlite = { version = "0.40", features = [
    "bundled-sqlcipher-vendored-openssl",
    "backup", # SQLCipher-aware online backup; a plain file copy is not crash-safe
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
strip = false

# Argon2id at 64 MiB is the whole cost of unlocking. Unoptimized, it takes
# long enough in `tauri dev` and the IPC tests to look like a hang, so the
# KDF crates are optimized even in debug builds. Nothing else changes.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'apps/desktop/src/help/**'
      - 'apps/desktop/src-tauri/icons/icon.svg'
      - 'docs/screenshots/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'apps/desktop/src/help/**'
      - 'apps/desktop/src-tauri/icons/icon.svg'
      - 'docs/screenshots/**'
      - '.github/workflows/website.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm --prefix website run check:sync
      - run: npm --prefix website test
      # A subdirectory-only context catches accidental parent-folder imports.
      - run: docker build --tag asset-manager-website:test website
